# 复制为 config.local.yaml 并填入真实值
# 本地测试: python main.py --dry-run

email:
  imap_server: imap.qq.com
  imap_port: 993
  username: "your_email@qq.com"
  password: "your_qq_authorization_code"
  sender_filter: "scholaralerts-noreply@google.com"

llm:
  api_base: "https://api.deepseek.com/v1"
  api_key: "sk-your-api-key"
  model: "deepseek-chat"
  temperature: 0.3

profile:
  interest: |
    我对以下研究方向感兴趣：
    - 大语言模型（LLM）的训练、微调与对齐
    - AI Agent 与多智能体系统
    - 检索增强生成（RAG）
  min_score: 6

output:
  dir: ./output
  max_papers_per_run: 15
