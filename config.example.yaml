# 复制为 config.local.yaml 并填入真实值
# 本地测试: python main.py --dry-run

email:
  imap_server: imap.qq.com
  imap_port: 993
  username: "your_email@qq.com"
  password: "your_qq_authorization_code"
  sender_filter: "scholaralerts-noreply@google.com"

llm:
  api_base: "https://api.deepseek.com/v1"
  api_key: "sk-your-api-key"
  model: "deepseek-chat"
  temperature: 0.3

profile:
  interest: |
    我对以下研究方向感兴趣：
    - 无线光通信（Wireless Optical Communication）
    - 光束指向与捕获跟踪（Beam Pointing, Acquisition and Tracking）

    我不感兴趣的领域：
    - 自由空间光通信中的大气湍流分析与补偿（Atmospheric turbulence analysis and compensation in FSO）
    - 自适应光学（Adaptive optics for FSO）
  min_score: 6

output:
  dir: ./output
  max_papers_per_run: 15

server:
  port: 8080
  password: "changeme"  # HTTP Basic Auth 密码，用户名 admin
