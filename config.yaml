# 邮箱论文整理 Agent 配置
# 复制此文件为 config.local.yaml 本地测试（不会被 git 追踪）

email:
  imap_server: imap.qq.com
  imap_port: 993
  username: "wudidadaqiuqiu@qq.com"
  # password: 通过环境变量 QQ_PASSWORD 传入，不要写在这里
  sender_filter: "scholaralerts-noreply@google.com"  # 只读取来自此发件人的邮件

llm:
  api_base: "https://api.deepseek.com/v1"  # OpenAI 兼容接口地址
  # api_key: 通过环境变量 LLM_API_KEY 传入
  model: "deepseek-v4-pro"
  temperature: 0.3

profile:
  interest: |
    我对以下研究方向感兴趣：
    - 无线光通信（Wireless Optical Communication）
    - 光束指向与捕获跟踪（Beam Pointing, Acquisition and Tracking）

    我不感兴趣的领域：
    - 自由空间光通信中的大气湍流分析与补偿（Atmospheric turbulence analysis and compensation in FSO）
    - 自适应光学（Adaptive optics for FSO）
  min_score: 6  # 1-10，评分 >= 此值的论文视为感兴趣，翻译标题+摘要

output:
  dir: ./output
  max_papers_per_run: 15  # 批量处理论文阈值

server:
  port: 5000
  password: "paper123"  # HTTP Basic Auth 密码，用户名 admin
